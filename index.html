<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0910" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Velvet Hour — The House on Nocturne Street</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="hud">
      <button class="brand-button" id="homeBtn" aria-label="Return to house">
        <span class="brand-mark">✦</span>
        <span><b>VELVET HOUR</b><small>The House on Nocturne Street</small></span>
      </button>
      <div class="chapter-hud">
        <div class="hud-label">CURRENT CHAPTER</div>
        <button id="chapterBtn" class="chapter-button"><span id="chapterNumber">I</span><b id="chapterName">The Front Room</b></button>
        <div class="chapter-progress"><i id="chapterBar"></i></div>
      </div>
      <div class="resources">
        <div class="resource" title="Coins"><span>🪙</span><b id="coins">0</b></div>
        <div class="resource" title="House reputation"><span>✦</span><b id="reputation">0</b></div>
        <div class="resource actions-left" title="Actions left tonight"><span>☾</span><b id="actionsLeft">3</b></div>
      </div>
      <button id="journalBtn" class="hud-icon" aria-label="Open journal">📓</button>
      <button id="menuBtn" class="hud-icon" aria-label="Open menu">☰</button>
    </header>

    <main id="screen" class="screen"></main>

    <nav class="mobile-dock" aria-label="Game navigation">
      <button data-nav="house" class="active"><span>🏚️</span><small>House</small></button>
      <button data-nav="mission"><span>🎯</span><small>Mission</small></button>
      <button data-nav="people"><span>💌</span><small>People</small></button>
      <button data-nav="journal"><span>📓</span><small>Journal</small></button>
    </nav>
  </div>

  <div id="modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div id="modalCard" class="modal-card"></div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="game.js"></script>
</body>
</html>
